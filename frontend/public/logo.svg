<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0e2a38" />
      <stop offset="100%" stop-color="#093a3e" />
    </linearGradient>

    <linearGradient id="logoTealCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="logoSolarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="logoRadarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#14b8a6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#logoBgGrad)" stroke="url(#logoTealCyan)" stroke-width="8" />

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="24" y1="128" x2="488" y2="128" />
    <line x1="24" y1="256" x2="488" y2="256" />
    <line x1="24" y1="384" x2="488" y2="384" />
    <line x1="128" y1="24" x2="128" y2="488" />
    <line x1="256" y1="24" x2="256" y2="488" />
    <line x1="384" y1="24" x2="384" y2="488" />
  </g>

  <!-- Orbit -->
  <ellipse cx="256" cy="256" rx="180" ry="85" fill="none" stroke="url(#logoTealCyan)" stroke-width="4" stroke-dasharray="8 6" opacity="0.45" transform="rotate(-28 256 256)" />

  <!-- Earth Curvature -->
  <path d="M 64 430 Q 256 340 448 430" fill="none" stroke="url(#logoTealCyan)" stroke-width="5" opacity="0.85" />
  <path d="M 96 448 Q 256 370 416 448" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.4" />

  <!-- Scanning Cone -->
  <polygon points="256,230 140,390 372,390" fill="url(#logoRadarPulse)" opacity="0.45" />

  <!-- Satellite Model -->
  <g transform="translate(0, -10)">
    <!-- Left Solar Wing -->
    <g transform="translate(110, 200) rotate(-15)">
      <rect x="0" y="0" width="76" height="44" rx="6" fill="url(#logoSolarGrad)" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="25" y1="0" x2="25" y2="44" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
      <line x1="50" y1="0" x2="50" y2="44" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
      <line x1="0" y1="22" x2="76" y2="22" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    </g>

    <rect x="180" y="218" width="22" height="6" rx="2" fill="#94a3b8" />

    <!-- Right Solar Wing -->
    <g transform="translate(326, 180) rotate(-15)">
      <rect x="0" y="0" width="76" height="44" rx="6" fill="url(#logoSolarGrad)" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="25" y1="0" x2="25" y2="44" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
      <line x1="50" y1="0" x2="50" y2="44" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
      <line x1="0" y1="22" x2="76" y2="22" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    </g>

    <rect x="308" y="218" width="22" height="6" rx="2" fill="#94a3b8" />

    <!-- Central Body -->
    <rect x="202" y="176" width="108" height="96" rx="18" fill="#0f172a" stroke="url(#logoTealCyan)" stroke-width="4.5" />
    <rect x="214" y="188" width="84" height="72" rx="10" fill="#0e2a38" stroke="#14b8a6" stroke-width="1.5" />

    <!-- Optical Sensor Lens -->
    <circle cx="256" cy="224" r="22" fill="#042f2e" stroke="#38bdf8" stroke-width="3" />
    <circle cx="256" cy="224" r="14" fill="#06b6d4" filter="url(#logoGlow)" />
    <circle cx="256" cy="224" r="7" fill="#ffffff" />

    <!-- Antenna Array -->
    <path d="M 230 148 Q 256 126 282 148" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="140" x2="256" y2="176" stroke="#94a3b8" stroke-width="3.5" />
    <circle cx="256" cy="130" r="4.5" fill="#14b8a6" filter="url(#logoGlow)" />
  </g>

  <!-- Signal Nodes -->
  <circle cx="390" cy="140" r="5" fill="#38bdf8" filter="url(#logoGlow)" />
  <circle cx="120" cy="110" r="4" fill="#14b8a6" opacity="0.8" />
  <circle cx="410" cy="340" r="3.5" fill="#06b6d4" opacity="0.7" />
</svg>
